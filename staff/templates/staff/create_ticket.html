{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ request_language|default:'de' }}">
<head>
    <meta charset="UTF-8">
    <title>{% trans "Create Ticket" %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="repair_system/static/favicon.ico" type="image/x-icon">
    <style>
        /* WhatsApp Float Button */
        .whatsapp-float {
            position: fixed;
            width: 60px;
            height: 60px;
            bottom: 30px;
            right: 30px;
            background-color: #25d366;
            color: white;
            border-radius: 50px;
            text-align: center;
            font-size: 30px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .whatsapp-float:hover {
            background-color: #20b857;
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- Fixed Header -->
<header class="bg-white shadow-md fixed w-full z-50 border-b">
  <div class="max-w-7xl mx-auto px-6 flex justify-between items-center h-16">
    <div class="flex items-center gap-3">
      <a href="{% url 'staff:dashboard' %}">
        <img src="/media/images/logo.png" alt="Tanitech Logo" class="h-10 w-auto">
      </a>
    </div>
    <div class="flex items-center gap-4">
      <a href="{% url 'staff:dashboard' %}" class="text-blue-600 hover:text-blue-800">
        &larr; {% trans "Back to Dashboard" %}
      </a>
    </div>
  </div>
</header>

<!-- Main Content -->
<main class="pt-24 pb-12 px-6">
    <form method="POST" class="loading-form max-w-2xl mx-auto bg-white p-6 rounded-xl shadow">
      {% csrf_token %}

      <h2 class="text-2xl font-bold mb-4">{% trans "Create Ticket Manually" %}</h2>

      <input name="client_first_name" placeholder="{% trans 'First name' %}" class="w-full border p-2 mb-3" required>
      <input name="client_last_name" placeholder="{% trans 'Last name' %}" class="w-full border p-2 mb-3" required>
      <input name="client_email" placeholder="{% trans 'Email' %}" class="w-full border p-2 mb-3" required>
      <input name="client_phone" placeholder="{% trans 'Phone' %}" class="w-full border p-2 mb-3" required>

      <input name="device_type" placeholder="{% trans 'Device type' %}" class="w-full border p-2 mb-3">
      <input name="device_model" placeholder="{% trans 'Device model' %}" class="w-full border p-2 mb-3">

      <textarea name="problem_description" placeholder="{% trans 'Problem' %}" class="w-full border p-2 mb-3"></textarea>

      <input name="estimated_price" placeholder="{% trans 'Price' %}" class="w-full border p-2 mb-3">

      <button type="submit" data-loading="Creating..." class="loading-btn bg-blue-600 text-white px-4 py-2 rounded">{% trans "Create & Send Contract" %}</button>
    </form>
</main>

<!-- WhatsApp Float Button -->
<a href="https://wa.me/4915904000040" target="_blank" class="whatsapp-float" title="Chat on WhatsApp">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="white">
