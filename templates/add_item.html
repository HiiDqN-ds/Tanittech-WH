{% extends "base.html" %}
{% block title %}{{ T.item_add_title }}{% endblock %}
{% block content %}
<h2>{{ T.item_add_title }}</h2>
<form method="POST">
  <div class="mb-3">
    <label>{{ T.common_name }}</label>
    <input name="name" class="form-control" required>
  </div>
  <div class="mb-3">
    <label>{{ T.common_barcode }}</label>
    <input name="barcode" class="form-control" required value="{{ form.barcode if form else '' }}">
  </div>

  <div class="mb-3">
    <label>{{ T.item_sku_label }}</label>
    <input name="sku" class="form-control" placeholder="{{ T.item_sku_placeholder }}" value="{{ form.sku if form else '' }}">
  </div>

  <div class="mb-3">
    <label>{{ T.item_purchase_price }}</label>
    <input name="purchase_price" type="number" step="0.01" class="form-control" required>
  </div>
  <div class="mb-3">
    <label>{{ T.item_selling_price }}</label>
    <input name="selling_price" type="number" step="0.01" class="form-control" required>
  </div>
  <div class="mb-3">
    <label>{{ T.item_min_selling_price }}</label>
    <input name="min_selling_price" type="number" step="0.01" class="form-control" required>
  </div>
  <div class="mb-3">
    <label>{{ T.common_quantity }}</label>
    <input name="quantity" type="number" class="form-control" value="1" required>
  </div>

  <div class="mb-3">
    <label>{{ T.item_description_label }}</label>
    <textarea name="description" class="form-control" rows="3">{{ item.description if item else '' }}</textarea>
  </div>

  <div class="mb-3">
    <label>{{ T.item_condition_label }}</label>
    <select name="item_condition" class="form-select">
      <option value="neu" selected>{{ T.item_condition_neu }}</option>
      <option value="gebraucht">{{ T.item_condition_gebraucht }}</option>
      <option value="defekt">{{ T.item_condition_defekt }}</option>
    </select>
  </div>

  <button class="btn btn-success" type="submit">{{ T.item_add_submit }}</button>

  <a href="{{ url_for('list_items') }}" class="btn btn-secondary">{{ T.common_cancel }}</a>

</form>
{% endblock %}
