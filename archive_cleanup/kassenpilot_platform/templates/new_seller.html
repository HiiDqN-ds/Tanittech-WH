{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2 style="margin-top:0;">New seller / worker</h2>
  <p class="muted" style="font-size:13px; margin-top:-8px;">You can grant/revoke exactly what they can access right after creating them.</p>
  <form method="post">
    <label>Username</label>
    <input name="username" value="{{ form.username or '' }}" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button class="btn" type="submit">Create seller</button>
    <a class="btn secondary" href="{{ url_for('admin_dashboard') }}">Cancel</a>
  </form>
</div>
{% endblock %}
